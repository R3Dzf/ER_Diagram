name: Deploy standalone Cloudflare staging

on:
  push:
    branches:
      - deploy/independent-cloudflare-20261012

permissions:
  contents: read

concurrency:
  group: bosha-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Opt-in only. Keeps the live ChatGPT Site and database untouched.
    if: ${{ github.ref == 'refs/heads/deploy/independent-cloudflare-20261012' && vars.BOSHA_STAGING_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.BOSHA_GOOGLE_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Verify required Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$D1_DATABASE_ID" || { echo "::error::Missing CLOUDFLARE_D1_DATABASE_ID secret"; exit 1; }

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source and account isolation
        run: |
          pnpm test
          pnpm typecheck

      - name: Configure isolated D1 database
        run: pnpm cloudflare:configure "$D1_DATABASE_ID"

      - name: Apply schema to isolated D1 only
        run: pnpm cloudflare:migrate

      - name: Build and deploy independent Worker
        run: pnpm cloudflare:deploy

      - name: Configure optional Google sign-in
        if: ${{ env.GOOGLE_CLIENT_ID != '' }}
        run: printf '%s' "$GOOGLE_CLIENT_ID" | pnpm exec wrangler secret put GOOGLE_CLIENT_ID --config wrangler.standalone.jsonc

      - name: Publish next-step instructions
        run: |
          echo "Cloudflare Worker bosha-studio deployed using the selected account and staging D1 database." >> "$GITHUB_STEP_SUMMARY"
          echo "Verify the workers.dev URL in the Wrangler output and test guest mode, Google sign-in, data isolation, diagram save and export." >> "$GITHUB_STEP_SUMMARY"
          echo "The original ChatGPT Site, its database, and main branch were not changed." >> "$GITHUB_STEP_SUMMARY"
