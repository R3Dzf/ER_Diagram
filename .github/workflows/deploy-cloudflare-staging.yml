name: Deploy standalone Cloudflare staging

on:
  push:
    branches:
      - deploy/independent-cloudflare-20261012

permissions:
  contents: read

concurrency:
  group: bosha-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Only this isolated staging branch can deploy. If there is no GitHub API token secret, do nothing.
    if: ${{ github.ref == 'refs/heads/deploy/independent-cloudflare-20261012' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: "6411cac8f04e7bc98a84aeac63fcebef"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: "0022588d-62ab-4765-8ccf-294c7d00e2e4"
      GOOGLE_CLIENT_ID: ${{ secrets.BOSHA_GOOGLE_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Check whether deployment is authorized
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deployment is disabled. Add CLOUDFLARE_API_TOKEN as a GitHub Actions secret, then request a new staging-branch run."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install locked dependencies
        if: steps.gate.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify source and account isolation
        if: steps.gate.outputs.ready == 'true'
        run: |
          pnpm test
          pnpm typecheck

      - name: Configure isolated D1 database
        if: steps.gate.outputs.ready == 'true'
        run: pnpm cloudflare:configure "$D1_DATABASE_ID"

      - name: Apply schema to isolated D1 only
        if: steps.gate.outputs.ready == 'true'
        run: pnpm cloudflare:migrate

      - name: Build and deploy independent Worker
        if: steps.gate.outputs.ready == 'true'
        run: pnpm cloudflare:deploy

      - name: Configure optional Google sign-in
        if: steps.gate.outputs.ready == 'true' && env.GOOGLE_CLIENT_ID != ''
        run: printf '%s' "$GOOGLE_CLIENT_ID" | pnpm exec wrangler secret put GOOGLE_CLIENT_ID --config wrangler.standalone.jsonc

      - name: Publish next-step instructions
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "Cloudflare Worker er-diagram deployed using the selected account and staging D1 database." >> "$GITHUB_STEP_SUMMARY"
          echo "Verify the workers.dev URL in the Wrangler output and test guest mode, Google sign-in, data isolation, diagram save and export." >> "$GITHUB_STEP_SUMMARY"
          echo "The original ChatGPT Site, its database, and main branch were not changed." >> "$GITHUB_STEP_SUMMARY"
